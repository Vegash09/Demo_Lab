# Scheduled refresh of the sales_etl pipeline. The job carries the schedule
# and notifications; the pipeline owns all compute and transformation logic.

resources:
  jobs:
    sales_etl_refresh:
      name: sales_etl_refresh

      trigger:
        # Run once a day, a day after the previous run. Paused automatically
        # in the dev target (mode: development).
        periodic:
          interval: 1
          unit: DAYS

      # email_notifications:
      #   on_failure:
      #     - data-platform@your-org.com

      tasks:
        - task_key: refresh_sales_etl
          pipeline_task:
            pipeline_id: ${resources.pipelines.sales_etl.id}

      queue:
        enabled: true

      permissions: ${var.job_permissions}
