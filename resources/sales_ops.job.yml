# Sales edge-of-lakehouse jobs — the two non-SDP lanes (see AGENTS.md,
# "Authoring rules"). All medallion tables stay in the SDP pipeline; these jobs
# only READ pipeline-owned tables (single-writer invariant).
#
#   sales_export             python-file lane: scheduled, headless export of
#                            gold to the export volume (spark_python_task).
#   sales_quarantine_report  notebook lane: on-demand, human-gated quarantine
#                            triage (notebook_task, deliberately NO trigger).
#
# Both reuse the pipeline's exact dependency mechanism: a serverless
# environment installing this repo with `--editable ${workspace.file_path}` —
# one delivery path, same caching gotcha (see AGENTS.md Critical knowledge).

resources:
  jobs:
    sales_export:
      name: sales_export

      trigger:
        # Weekly snapshot; paused automatically in dev (mode: development).
        periodic:
          interval: 1
          unit: WEEKS

      # Bundle variables → job parameters → task argv. Zero hardcoding.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: export_path
          default: ${var.sales_export_path}

      environments:
        - environment_key: datalab
          spec:
            environment_version: "4"
            dependencies:
              - --editable ${workspace.file_path}

      tasks:
        - task_key: export_customer_summary
          environment_key: datalab
          spark_python_task:
            python_file: ../src/jobs/sales/export_customer_summary.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--gold-schema"
              - "{{job.parameters.gold_schema}}"
              - "--export-path"
              - "{{job.parameters.export_path}}"

      queue:
        enabled: true

      permissions: ${var.job_permissions}

    sales_quarantine_report:
      name: sales_quarantine_report

      # No trigger: this lane is human-gated by design. Run it with
      #   databricks bundle run sales_quarantine_report -t dev

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: silver_schema
          default: ${var.silver_schema}

      environments:
        - environment_key: datalab
          spec:
            environment_version: "4"
            dependencies:
              - --editable ${workspace.file_path}

      tasks:
        - task_key: quarantine_report
          environment_key: datalab
          notebook_task:
            notebook_path: ../notebooks/sales/quarantine_report.py
            base_parameters:
              # widget name == job parameter name — the lane's contract,
              # resolved in the notebook via datalab.params.notebook_params.
              catalog: "{{job.parameters.catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

      queue:
        enabled: true

      permissions: ${var.job_permissions}
