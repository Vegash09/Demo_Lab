# Project metadata + build config + tool configs.
#
# Dependency management is `uv`-driven. ONE source of truth:
#
#   pyproject.toml [project] + [dependency-groups]
#         │
#         │  uv lock   → uv.lock   (transitive pins for reproducibility)
#         │  uv sync   → .venv/    (creates + populates the venv)
#         ▼
#   uv.lock — committed; CI uses `uv sync --frozen` so any unexpected drift fails fast.
#
# Use `uv sync` locally; `uv run pytest` for tests; `uv run ruff check` for linting.
#
# NOTE on pipeline runtime deps: the Lakeflow Spark Declarative Pipelines runtime
# installs this project with `--editable ${workspace.file_path}` (see
# resources/sales_etl.pipeline.yml). Anything you add to [project].dependencies
# is installed into the pipeline environment on top of the pinned
# environment_version. Keep it empty unless a transformation truly needs an
# extra library — pyspark itself is provided by the runtime.

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name            = "datalab"
version         = "0.2.0"
description     = "Medallion (bronze→silver→gold) lakehouse framework on Lakeflow Spark Declarative Pipelines, shipped as a Declarative Automation Bundle."
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.12,<3.14"   # serverless environment v4/v5 ships Python 3.12
authors         = [{ name = "Datalab Team", email = "nivethan.venkatachalam@diggibyte.com" }]
keywords        = ["databricks", "lakeflow", "spark-declarative-pipelines", "medallion", "lakehouse"]

# Runtime dependencies installed into the pipeline environment (keep minimal —
# the SDP runtime already provides pyspark, delta, etc.).
# - pydantic capped <2.11: serverless env v4 preinstalls 2.10.6; the framework
#   must not use 2.11+ features even though the local venv resolves newer.
# - databricks-labs-dqx pinned EXACT (Beta, breaking minor releases) and with
#   NO extras: the [cli] extra pulls databricks-connect, which conflicts with
#   the local pyspark dev dependency.
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "databricks-labs-dqx==0.14.0",
]

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735) — dev-only tooling, never shipped to pipelines.
# `uv sync` installs the `dev` group by default.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    # Local Spark for fast unit tests of the pure functions in src/datalab.
    # pyspark 4.1+ also provides `pyspark.pipelines` so SDP imports resolve
    # locally. Do NOT add databricks-connect to this venv — it conflicts with
    # pyspark (both own the `pyspark` namespace).
    "pyspark>=4.1.0",
    # dqx's check_funcs imports pandas but doesn't declare it; serverless
    # preinstalls pandas, locally we need it for the dqx unit tests.
    "pandas>=2.0",
]

# ---------------------------------------------------------------------------
# Hatchling build target: the shared `datalab` package (src layout).
# The pipeline environment installs this editable so transformations can
# `from datalab.transforms import ...`.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/datalab"]

# ---------------------------------------------------------------------------
# Tool configs
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-ra --tb=short"

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), import-sort (I), pyupgrade (UP), bugbear (B)
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]   # line length — handled by line-length above

[tool.ruff.lint.isort]
known-first-party = ["datalab"]

# `spark` is injected by the SDP runtime in pipeline source files; ruff would
# otherwise flag it as undefined. Notebooks additionally get `dbutils`/`display`
# ambient globals (F821) and cell-structured imports (E402). src/jobs/ gets NO
# ignore — entry points build their own SparkSession, so an undefined name
# there is a real bug.
[tool.ruff.lint.per-file-ignores]
"src/sales_etl/**" = ["F821"]
"notebooks/**" = ["F821", "E402"]

[tool.uv]
managed = true
