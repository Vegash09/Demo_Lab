# Project metadata + build config + tool configs.
#
# Dependency management is `uv`-driven. ONE source of truth:
#
#   pyproject.toml [project] + [dependency-groups]
#         │
#         │  uv lock   → uv.lock   (transitive pins for reproducibility)
#         │  uv sync   → .venv/    (creates + populates the venv)
#         ▼
#   uv.lock — committed; CI uses `uv sync --frozen` so any unexpected drift fails fast.
#
# Use `uv sync` locally; `uv run pytest` for tests; `uv run ruff check` for linting.
#
# NOTE on pipeline runtime deps: the Lakeflow Spark Declarative Pipelines runtime
# installs this project with `--editable ${workspace.file_path}` (see
# examples/customer_sales/resources/customer_sales_etl.pipeline.yml). Anything you add to [project].dependencies
# is installed into the pipeline environment on top of the pinned
# environment_version. Keep it empty unless a transformation truly needs an
# extra library — pyspark itself is provided by the runtime.

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name            = "datalab"
version         = "0.2.0"
description     = "Medallion (bronze→silver→gold) lakehouse framework on Lakeflow Spark Declarative Pipelines, shipped as a Declarative Automation Bundle."
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.12,<3.14"   # serverless environment v4/v5 ships Python 3.12
authors         = [{ name = "Datalab Team", email = "nivethan.venkatachalam@diggibyte.com" }]
keywords        = ["databricks", "lakeflow", "spark-declarative-pipelines", "medallion", "lakehouse"]

# Runtime dependencies installed into the pipeline environment (keep minimal —
# the SDP runtime already provides pyspark, delta, etc.).
# - pydantic capped <2.11: serverless env v4 preinstalls 2.10.6; the framework
#   must not use 2.11+ features even though the local venv resolves newer.
# - databricks-labs-dqx pinned EXACT (Beta, breaking minor releases) and with
#   NO extras: the [cli] extra pulls databricks-connect, which conflicts with
#   the local pyspark dev dependency.
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "databricks-labs-dqx==0.14.0",
]

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735) — dev-only tooling, never shipped to pipelines.
# `uv sync` installs the `dev` group by default.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    # Local Spark for fast unit tests of the pure functions in src/datalab.
    # The [pipelines] extra adds the `spark-pipelines` CLI + Spark Connect deps,
    # so the OSS local-run profile (datalab.framework.local, `make run-local`)
    # executes the whole medallion locally — see docs/FRAMEWORK.md "Run locally".
    # Do NOT add databricks-connect to THIS venv — it conflicts with pyspark
    # (both own the `pyspark` namespace); the Connect validation path uses an
    # isolated, out-of-lock overlay instead (`make validate-connect`).
    "pyspark[pipelines]>=4.1.0",
    # dqx's check_funcs imports pandas but doesn't declare it; serverless
    # preinstalls pandas, locally we need it for the dqx unit tests.
    "pandas>=2.0",
]

# ---------------------------------------------------------------------------
# Hatchling build targets, installed editable into pipeline/job environments:
#   src/datalab — THE framework (the only package under src/; no domain code;
#                 lift-and-shift)
#   examples/customer_sales/src/customer_sales_etl — the customer_sales
#                 REFERENCE domain adopting it (kept under examples/, still
#                 packaged so the demo pipeline can import it)
# A new domain = add its <...>/src/<catalog>_etl package dir here (the package
# name is the last path component, so imports stay `customer_sales_etl.…`).
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = [
    "src/datalab",
    "examples/customer_sales/src/customer_sales_etl",
    "examples/sales/src/sales_etl",
]

# ---------------------------------------------------------------------------
# Tool configs
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# tests/ = framework-only suite (no example dependency); examples/*/tests =
# each example domain's own tests (transforms + end-to-end contract).
testpaths = ["tests", "examples"]
addopts   = "-ra --tb=short"

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), import-sort (I), pyupgrade (UP), bugbear (B)
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]   # line length — handled by line-length above

[tool.ruff.lint.isort]
# customer_sales_etl lives under examples/ (outside ruff's src-root detection)
# but is first-party — it's this repo's reference domain package.
known-first-party = ["datalab", "customer_sales_etl"]

# `spark` is injected by the SDP runtime in pipeline source files; ruff would
# otherwise flag it as undefined. Notebooks additionally get `dbutils`/`display`
# ambient globals (F821) and cell-structured imports (E402). The jobs lane
# (examples/*/src/jobs/) gets NO ignore — entry points build their own
# SparkSession, so an undefined name there is a real bug.
[tool.ruff.lint.per-file-ignores]
# Only the SDP-interpreted entrypoint gets the ambient-`spark` allowance;
# domain transforms/checks are ordinary python and keep full linting.
"examples/*/src/*/transformations/**" = ["F821"]
"notebooks/**" = ["F821", "E402"]
"examples/*/notebooks/**" = ["F821", "E402"]

[tool.uv]
managed = true
