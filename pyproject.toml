[tool.poetry]
name = "datalab-etl"
version = "0.1.0"
description = "Minimal Databricks data processing toolkit with common IO and DQ"
authors = ["Datalab Team nivethan.venkatachalam@diggibyte.com"]
license = "MIT"
readme = "README.md"
packages = [{ include = "datalab_etl", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
databricks-labs-dqx = ">=0.9.3"
databricks-sdk = ">=0.67.0"
delta-spark = "3.2.0"
pyspark = "3.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
python-dotenv = "*"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
