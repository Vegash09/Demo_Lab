# yaml-language-server: $schema=../../../../../schemas/table_config.schema.json
#
# Target table: gold.sales_by_category — business aggregate (batch MV): units
# and revenue per product category/subcategory. The source is silver.order_items;
# the product category is joined in from silver.products inside the transform
# (the framework's column mapping cannot express a join — see the transform's
# docstring and docs/FRAMEWORK.md). No columns: mapping; the transform owns the
# output shape.
schema_version: 1
name: sales_by_category
comment: Units sold and revenue per product category/subcategory.
source:
  kind: table
  name: order_items
  layer: silver
transform:
  - function: sales.sales_by_category
target:
  kind: materialized_view
