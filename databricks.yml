bundle:
  name: datalab

include:
  - permissions/**/*.yml
  - pipelines/*.yml

artifacts:
  default:
    type: whl
    build: pip install --upgrade pip 'poetry>=1.8.0' && poetry build --format wheel
    path: .

targets:
  dev:
    workspace:
      root_path: /Bundles/${bundle.name}/${bundle.target}
      host: https://adb-7488500312027058.18.azuredatabricks.net/
  staging:
    workspace:
      root_path: /Bundles/${bundle.name}/${bundle.target}
      host: https://adb-7488500312027058.18.azuredatabricks.net/
  prod:
    workspace:
      root_path: /Bundles/${bundle.name}/${bundle.target}
      host: https://adb-7488500312027058.18.azuredatabricks.net/
