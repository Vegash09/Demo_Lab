resources:
  jobs:
    sales_bronze_to_silver:
      name: ${bundle.name}-sales-bronze-to-silver-${bundle.target}
      trigger:
        pause_status: PAUSED

      parameters:
        - name: config_path
          default: "${workspace.root_path}/files/config/bronze_silver/bu_sales/bronze_to_silver.json"

      tasks:
        - task_key: bronze_to_silver
          libraries:
            - whl: ../dist/*.whl
          job_cluster_key: default_cluster
          notebook_task:
            notebook_path: "${workspace.root_path}/files/notebooks/bronze_silver/bu_sales/bronze_to_silver.py"
            source: WORKSPACE
            base_parameters:
              [
                "--config_path",
                "{{ job.parameters.config_path }}"]
            

      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: "16.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 1
      
      queue:
        enabled: true
      
      permissions: ${var.workflow_permissions}


