# yaml-language-server: $schema=../../schemas/layer_config.schema.json
#
# Gold: business aggregates as materialized views (batch end to end).
schema_version: 1
domain: sales
layer: gold
defaults:
  catalog_conf: datalab.catalog
  schema_conf: datalab.gold_schema
  table_properties:
    datalab.layer: gold
datasets:
  - name: customers_by_city
    comment: Customer counts and average age per city.
    source:
      kind: table
      name: customers
      schema_conf: datalab.silver_schema
    transform:
      - function: sales.summarize_customers_by_city
    target:
      kind: materialized_view
