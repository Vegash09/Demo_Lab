# yaml-language-server: $schema=../../schemas/layer_config.schema.json
#
# Bronze: raw ingestion. Add a table = add a dataset entry; no python needed.
schema_version: 1
domain: sales
layer: bronze
defaults:
  catalog_conf: datalab.catalog
  schema_conf: datalab.bronze_schema
  table_properties:
    datalab.layer: bronze
datasets:
  - name: customers_raw
    comment: Raw customer feed ingested incrementally from the landing volume (Auto Loader).
    source:
      kind: cloud_files
      path_conf: datalab.sales_landing_path
      format: json
      options:
        cloudFiles.inferColumnTypes: "true" # quote YAML-1.1 ambiguous scalars
        cloudFiles.schemaEvolutionMode: addNewColumns
      add_lineage: true # framework adds _ingest_ts + _source_file
    target:
      kind: streaming_table
