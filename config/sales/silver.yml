# yaml-language-server: $schema=../../schemas/layer_config.schema.json
#
# Silver: validated, deduplicated entities. checks: are databrickslabs/dqx
# metadata, copy-pasteable from the dqx docs.
schema_version: 1
domain: sales
layer: silver
imports: # domain modules registering this layer's transforms/checks
  - sales_etl.transforms.sales
defaults:
  catalog_conf: datalab.catalog
  schema_conf: datalab.silver_schema
  table_properties:
    datalab.layer: silver
datasets:
  - name: customers
    comment: Current customer profile per customer_id (SCD1), validated and deduplicated.
    source:
      kind: table
      name: customers_raw
      schema_conf: datalab.bronze_schema # per-source override of layer defaults
      as_stream: true
    transform:
      - function: sales.clean_customers
    quality:
      checks:
        - name: valid_customer_id
          criticality: error # error rows never reach silver.customers
          check:
            function: is_not_null
            arguments:
              column: customer_id
        - name: valid_email
          criticality: warn # warn rows pass through, flagged
          filter: email IS NOT NULL
          check:
            function: regex_match
            arguments:
              column: email
              regex: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
      quarantine:
        name: customers_quarantine
        include_warnings: false # quarantine == exactly the dropped rows
    target:
      kind: streaming_table
      cdc: # dp.create_streaming_table + AUTO CDC flow
        keys: [customer_id]
        sequence_by: _ingest_ts
        scd_type: 1
