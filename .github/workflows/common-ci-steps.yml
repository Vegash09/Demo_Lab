name: "CI · lint + test + validate"

# Reusable workflow. Called by ci-cd-{dev,stage,prod}.yml.
# Lint + unit tests run against a local Spark — no workspace, no secrets.
# Bundle validation authenticates via GitHub OIDC.

on:
  workflow_call:
    inputs:
      target:
        description: "Bundle target (dev | stage | prod). Avoid the name 'env' here — it shadows GitHub Actions' env: keyword."
        required: true
        type: string

permissions:
  id-token: write    # required for OIDC auth on the validate-bundle job
  contents: read

jobs:
  test:
    name: "lint + unit test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Java (local Spark for unit tests)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check framework App credentials are configured
        # uv resolves `datalab` from the PRIVATE dediggibyte/datalab-framework repo.
        # We authenticate with a short-lived token minted from the datalab-framework
        # reader GitHub App (App id + private key) — no SSH deploy key, no PAT to
        # rotate. Fail fast with an actionable message before the token step. See
        # docs/CICD.md.
        env:
          APP_ID:  ${{ vars.DATALAB_FRAMEWORK_APP_ID }}
          APP_KEY: ${{ secrets.DATALAB_FRAMEWORK_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error title=Missing framework App credentials::CI must mint a token from the datalab-framework reader GitHub App to clone the PRIVATE dediggibyte/datalab-framework repo, but the DATALAB_FRAMEWORK_APP_ID variable and/or DATALAB_FRAMEWORK_APP_PRIVATE_KEY secret is not set. See docs/CICD.md."
            exit 1
          fi

      - name: Mint a read-only token for datalab-framework (GitHub App)
        # Short-lived installation token (~1h, auto-revoked in a post step),
        # scoped to just dediggibyte/datalab-framework. The App is installed on
        # that repo with Contents: read-only.
        id: framework_token
        uses: actions/create-github-app-token@v3
        with:
          app-id:       ${{ vars.DATALAB_FRAMEWORK_APP_ID }}
          private-key:  ${{ secrets.DATALAB_FRAMEWORK_APP_PRIVATE_KEY }}
          owner:        dediggibyte
          repositories: datalab-framework

      - name: Route the private framework clone over HTTPS with the token
        # uv's git clone of `datalab @ git+https://…/datalab-framework` picks up
        # this rewrite; the token replaces the SSH deploy key.
        env:
          FRAMEWORK_TOKEN: ${{ steps.framework_token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${FRAMEWORK_TOKEN}@github.com/dediggibyte/datalab-framework".insteadOf \
            "https://github.com/dediggibyte/datalab-framework"

      - name: Sync dependencies (frozen — fails fast if uv.lock drifted)
        run: uv sync --frozen

      - name: Ruff lint
        # Same paths as `make lint` — the framework moved to the datalab-framework
        # repo; here we lint scripts/ + the reference domains under projects/.
        run: uv run ruff check scripts projects

      - name: Check agent-skill mirror is in sync (no drift from .agents/skills)
        # Mirror of `make check-skills`. Skills are authored once under
        # .agents/skills/ (read natively by Cursor + Codex); .claude/skills is a
        # generated copy for Claude Code (scripts/sync_skills.py). Fails on drift.
        run: uv run python scripts/sync_skills.py --check

      - name: Validate dataset configs (pydantic + static dqx checks)
        # Same loader as `make validate-configs`, the pipeline import, and the
        # editor schemas: a bad artifact fails CI before any deploy. Mirrors
        # the Makefile's CONFIG_DIRS (root config/ for adopters, projects/*/config here).
        run: |
          dirs=()
          for d in config projects/*/config; do [ -d "$d" ] && dirs+=("$d"); done
          uv run python -m datalab.framework "${dirs[@]}"

      - name: Unit tests (local Spark)
        run: uv run pytest

      - name: Local SDP graph dry-run (OSS spark-pipelines)
        # Guards the local-run profile (datalab.framework.local): generates the
        # spark-pipeline.yml and runs `spark-pipelines dry-run` (syntax/analysis/
        # graph validation, no data) on the same Java as the unit tests. Advisory
        # (continue-on-error) — the blocking regression guard is the capture test
        # in tests/unit/framework/test_local.py; this exercises the OSS CLI end to
        # end while the SDP + dqx + Spark Connect path stabilizes upstream.
        run: make dry-run-local
        continue-on-error: true

  validate-bundle:
    name: "bundle validate (${{ inputs.target }})"
    needs: test
    runs-on: ubuntu-latest
    # Resolves secrets.* against the GitHub Environment matching the target.
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST:      ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Databricks CLI (OIDC)
        uses: ./.github/actions/databricks-setup
        with:
          databricks-host:      ${{ secrets.DATABRICKS_HOST }}
          databricks-client-id: ${{ secrets.DATABRICKS_CLIENT_ID }}

      - name: databricks bundle validate -t ${{ inputs.target }}
        run: databricks bundle validate -t ${{ inputs.target }}
