name: "CI/CD · prod"

# Prod deploys on release tags or manual dispatch. Add required reviewers to
# the `prod` GitHub Environment so deploys need an approval.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "!v*-rc*"

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/common-ci-steps.yml
    with:
      target: prod
    secrets: inherit

  deploy:
    needs: ci
    uses: ./.github/workflows/common-cd-steps.yml
    with:
      target: prod
    secrets: inherit
