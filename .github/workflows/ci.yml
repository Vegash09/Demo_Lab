name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development/**
  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of tests to run (pyspark|dbconnect)"
        type: choice
        options:
          - pyspark
          - dbconnect
        default: pyspark
        required: true
      gdai_env:
        description: "Databricks profile/environment name (e.g., dev, stage)"
        required: false
        default: "dev"

jobs:
  pyspark_pr:
    name: PySpark unit tests (PR/push)
    if: ${{ github.event_name != 'workflow_dispatch' }}
    uses: ./.github/workflows/common-ci.yml
    with:
      test_type: "pyspark"
      python_version: "3.12"
      target_env: "dev"

  pyspark_manual:
    name: PySpark unit tests (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_type == 'pyspark' }}
    uses: ./.github/workflows/common-ci.yml
    with:
      test_type: "pyspark"
      python_version: "3.12"
      target_env: "dev"

  dbconnect:
    name: Databricks Connect integration tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_type == 'dbconnect' }}
    uses: ./.github/workflows/common-ci.yml
    secrets: inherit
    with:
      test_type: "dbconnect"
      python_version: "3.11"
      target_env: "dev"
