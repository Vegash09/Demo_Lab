name: Common CI steps

on:
  workflow_call:
    inputs:
      test_type:
        required: true
        type: string
      python_version:
        required: true
        type: string
      target_env:
        required: true
        type: string
      coverage_threshold:
        required: false
        type: string
        default: "70"

jobs:
  run-common-steps:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    env:
      ENV: ${{ inputs.target_env }}
      DATABRICKS_PROFILE: ${{ inputs.target_env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python and uv setup
        uses: ./.github/actions/setup-python
        with:
          python_version: ${{ inputs.python_version }}

      - name: Databricks setup (dbconnect only)
        if: ${{ inputs.test_type == 'dbconnect' }}
        uses: ./.github/actions/setup-databricks
        with:
          azure_client_id: "${{ vars.AZURE_CLIENT_ID }}"
          azure_tenant_id: "${{ vars.AZURE_TENANT_ID }}"
          databricks_host: "${{ vars.DATABRICKS_HOST }}"
          cluster_id: "${{ vars.CLUSTER_ID }}"
          profile: "${{ inputs.target_env }}"

      - name: Install dependencies (pyspark)
        if: ${{ inputs.test_type == 'pyspark' }}
        shell: bash
        run: |
          set -euxo pipefail
          # Install project with pyspark extras and test deps
          uv pip install -e ".[pyspark]"
          uv pip install pytest pytest-cov python-dotenv

      - name: Install dependencies (dbconnect)
        if: ${{ inputs.test_type == 'dbconnect' }}
        shell: bash
        run: |
          set -euxo pipefail
          # Install project with dbconnect extras and test deps (no local pyspark)
          uv pip install -e ".[dbconnect]"
          uv pip install pytest pytest-cov python-dotenv

      - name: Run tests (pyspark)
        if: ${{ inputs.test_type == 'pyspark' }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p reports
          # Exclude dbconnect-only tests, run unit + local integration
          uv run pytest -m "not dbconnect_only" \
            --cov=src \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=html \
            --junitxml=reports/junit-pyspark.xml \
            -q
          # Enforce coverage threshold
          uv run python - << 'PY'
          import sys
          import xml.etree.ElementTree as ET
          import os
          threshold = float(os.environ.get('COV_REQ', '70'))
          root = ET.parse('coverage.xml').getroot()
          # total line-rate is in coverage@line-rate
          rate = float(root.attrib.get('line-rate', '0')) * 100
          print(f"Coverage: {rate:.2f}% (required {threshold}%)")
          if rate + 1e-6 < threshold:
              sys.exit(1)
          PY
        env:
          COV_REQ: "${{ inputs.coverage_threshold }}"

      - name: Run tests (dbconnect)
        if: ${{ inputs.test_type == 'dbconnect' }}
        shell: bash
        env:
          DATABRICKS_TOKEN: "${{ secrets.DATABRICKS_TOKEN }}"
        run: |
          set -euxo pipefail
          mkdir -p reports
          uv run pytest -m dbconnect_only notebooks/tests/integration_testing \
            --cov=src \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=html \
            --junitxml=reports/junit-dbconnect.xml \
            -q
          uv run python - << 'PY'
          import sys
          import xml.etree.ElementTree as ET
          import os
          threshold = float(os.environ.get('COV_REQ', '70'))
          root = ET.parse('coverage.xml').getroot()
          rate = float(root.attrib.get('line-rate', '0')) * 100
          print(f"Coverage: {rate:.2f}% (required {threshold}%)")
          if rate + 1e-6 < threshold:
              sys.exit(1)
          PY
        env:
          COV_REQ: "${{ inputs.coverage_threshold }}"

      - name: Publish test artifacts (${{ inputs.test_type }}-py-${{ inputs.python_version }})
        uses: ./.github/actions/publish-test-artifacts
        with:
          test_type: "${{ inputs.test_type }}"
          python_version: "${{ inputs.python_version }}"
