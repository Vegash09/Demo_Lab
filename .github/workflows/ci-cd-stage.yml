name: "CI/CD · stage"

# Stage runs on manual dispatch or on a release-candidate tag.
# Configure the `stage` GitHub Environment (secrets + optional reviewers).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/common-ci-steps.yml
    with:
      target: stage
    secrets: inherit

  deploy:
    needs: ci
    uses: ./.github/workflows/common-cd-steps.yml
    with:
      target: stage
    secrets: inherit
