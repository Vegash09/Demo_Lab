name: "CI/CD · dev"

# dev gets full CI on every PR + main push, plus auto-deploy on every push
# to main. Stage/prod are gated separately (tags / manual dispatch).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/common-ci-steps.yml
    with:
      target: dev
    secrets: inherit

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/common-cd-steps.yml
    with:
      target: dev
    secrets: inherit
