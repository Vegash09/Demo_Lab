name: "Setup Python + uv"
description: "Install requested Python version and uv, and create a venv"
inputs:
  python_version:
    description: "Python version (e.g., 3.11, 3.12)"
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v1

    - name: Create virtual environment
      shell: bash
      run: |
        set -euxo pipefail
        uv venv -p "${{ inputs.python_version }}"
