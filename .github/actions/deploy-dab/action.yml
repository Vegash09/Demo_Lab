name: "Deploy Declarative Automation Bundle"
description: "Validate + deploy the datalab bundle to the given target."

inputs:
  target:
    description: "Bundle target (dev | stage | prod). Avoid the name 'env' here — it shadows GitHub Actions' env: keyword."
    required: true
  profile:
    description: "Databricks CLI profile."
    required: false
    default: "DEFAULT"
  auto-approve:
    description: >-
      Pass --auto-approve to `bundle deploy` so a non-interactive CI console can
      apply DESTRUCTIVE changes (e.g. deleting a renamed/removed pipeline and its
      streaming tables / materialized views). Enable only for disposable targets
      (dev, mode: development — a full refresh restores all STs/MVs). Leave
      "false" for stage/prod so pipeline/table/volume deletions are reviewed by a
      human before they run.
    required: false
    default: "false"

  # Per-target overrides. Empty defaults mean 'use whatever the bundle
  # (databricks.yml + rbac.yml) says'. Only string variables can be overridden
  # with --var (complex variables like pipeline_permissions cannot) — which is
  # why the permission GROUP NAMES are plain string variables in rbac.yml that
  # the complex defaults reference.
  catalog:
    description: "Unity Catalog catalog override for this target."
    required: false
    default: ""
  sales-landing-path:
    description: "Override for the Auto Loader landing volume path."
    required: false
    default: ""
  reader-group:
    description: "Workspace group granted read/run access (overrides var.reader_group)."
    required: false
    default: ""
  engineer-group:
    description: "Workspace group granted manage access (overrides var.engineer_group)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # `bundle deploy` builds the example domain wheels (`uv build --package …`,
    # see databricks.yml artifacts) and the publish step below builds + uploads
    # the FRAMEWORK wheel — so uv must be on PATH here. (`bundle validate` does
    # NOT build artifacts, which is why the validate-only CI job doesn't need it.)
    # Mirrors the CI test job's uv setup.
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # Publish the datalab FRAMEWORK wheel into each project catalog's
    # `artifacts.wheels` Volume BEFORE deploy, so the version each domain
    # references (var.datalab_wheel / var.sales_datalab_wheel) is present when a
    # pipeline first runs. publish_wheel uploads to the per-target domain catalogs
    # (bootstrap_uc.CATALOGS); the bundle builds only the example domain wheels. If
    # a domain catalog is overridden (--var catalog), pass --catalog to match.
    # PRECONDITION: each project catalog's artifacts.wheels Volume already exists —
    # `make bootstrap-uc TARGET=<t>` provisions it. Auth is the same OIDC env the
    # deploy uses (set at the job level); the Databricks SDK picks it up ambiently.
    # `--with databricks-sdk` / `--with pip` keep the SDK + pip out of uv.lock.
    - name: Publish datalab framework wheel to each project catalog's volume
      shell: bash
      run: |
        # Build the FRAMEWORK wheel from the pinned git dep (pyproject
        # [tool.uv.sources].datalab) into an isolated dir, then upload — never
        # touches the bundle's dist/ (which `bundle deploy` fills with the example
        # wheels right after). `--with pip` builds the wheel, `--with databricks-sdk`
        # uploads it; neither enters uv.lock.
        uv run --with databricks-sdk --with pip python scripts/publish_wheel.py \
          --target "${{ inputs.target }}" --build --apply

    # Validate and deploy in one step so the quoted --var argument array
    # (group names may contain spaces) doesn't have to cross a step boundary.
    - name: bundle validate + deploy
      shell: bash
      env:
        GIT_SHA: ${{ github.sha }}
        CI: "true"
        IN_CATALOG:        ${{ inputs.catalog }}
        IN_LANDING_PATH:   ${{ inputs.sales-landing-path }}
        IN_READER_GROUP:   ${{ inputs.reader-group }}
        IN_ENGINEER_GROUP: ${{ inputs.engineer-group }}
        AUTO_APPROVE:      ${{ inputs.auto-approve }}
      run: |
        ARGS=(-t "${{ inputs.target }}" -p "${{ inputs.profile }}")
        [ -n "$IN_CATALOG" ]        && ARGS+=(--var "catalog=$IN_CATALOG")
        [ -n "$IN_LANDING_PATH" ]   && ARGS+=(--var "sales_landing_path=$IN_LANDING_PATH")
        [ -n "$IN_READER_GROUP" ]   && ARGS+=(--var "reader_group=$IN_READER_GROUP")
        [ -n "$IN_ENGINEER_GROUP" ] && ARGS+=(--var "engineer_group=$IN_ENGINEER_GROUP")

        databricks bundle validate "${ARGS[@]}"

        # --auto-approve is a deploy-only flag (validate rejects it). It is added
        # only for targets that opt in (dev) so CI can apply destructive changes
        # without a prompt; stage/prod deploy without it and fail loudly on a
        # destructive plan, leaving the deletion for a human to review.
        DEPLOY_ARGS=("${ARGS[@]}")
        [ "$AUTO_APPROVE" = "true" ] && DEPLOY_ARGS+=(--auto-approve)
        databricks bundle deploy   "${DEPLOY_ARGS[@]}"
