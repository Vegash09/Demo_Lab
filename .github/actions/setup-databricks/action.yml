name: Databricks setup
description: Set up Databricks configuration

inputs:
  azure-client-id:
    description: Azure Client ID
    required: true
  azure-tenant-id:
    description: Azure Tenant ID
    required: true
  databricks-host:
    description: Databricks Host
    required: true
  cluster-id:
    description: Databricks Cluster ID
    required: true
  profile:
    description: Databricks Profile Name
    required: true

runs:
  using: composite
  steps:
    - name: Login with federated credentials
      uses: Azure/login@v2
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        allow-no-subscriptions: true

    - name: Define Databricks configuration
      shell: bash
      run: |
        DATABRICKS_AAD_TOKEN=$(az account get-access-token --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d | jq -r '.accessToken')
        
        echo "[${{ inputs.profile }}]
        host = ${{ inputs.databricks-host }}
        cluster_id = ${{ inputs.cluster-id }}
        token = $DATABRICKS_AAD_TOKEN" > ~/.databrickscfg

    - name: Setup Databricks CLI
      uses: databricks/setup-cli@main