name: "Publish Test Artifacts"
description: "Upload coverage reports and JUnit XML"
inputs:
  test_type:
    description: "pyspark or dbconnect"
    required: true
  python_version:
    description: "Python version used"
    required: true
runs:
  using: "composite"
  steps:
    - name: Upload coverage XML
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ inputs.test_type }}-py-${{ inputs.python_version }}.xml
        path: coverage.xml
        if-no-files-found: warn

    - name: Upload HTML coverage
      uses: actions/upload-artifact@v4
      with:
        name: htmlcov-${{ inputs.test_type }}-py-${{ inputs.python_version }}
        path: htmlcov
        if-no-files-found: warn

    - name: Upload JUnit report
      uses: actions/upload-artifact@v4
      with:
        name: junit-${{ inputs.test_type }}-py-${{ inputs.python_version }}.xml
        path: reports/junit-${{ inputs.test_type }}.xml
        if-no-files-found: warn
